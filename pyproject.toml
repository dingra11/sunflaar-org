[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sunflaar"
version = "1.2.0"
description = "Heliophysics Terminal for Solar Flare Prediction"
authors = [{ name = "Jashan", email = "astrodingra@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "pandas>=1.0.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "requests>=2.25.0",
    "matplotlib>=3.5.0",
    "streamlit>=1.30.0",
    "sunpy>=5.0.0",
    "astropy>=5.0.0",
    "pywavelets>=1.4.0",
    "scipy>=1.9.0",
    "seaborn>=0.12.0",
    "zeep>=4.0.0",
    "drms>=0.6.0"
]

[project.scripts]
sunflaar = "sunflaar.cli:main"

[tool.setuptools.packages.find]
include = ["sunflaar*"]